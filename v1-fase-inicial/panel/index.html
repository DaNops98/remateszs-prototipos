<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rematezs · Panel interno de adjudicaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F4EE; --paper:#FFFFFF; --ink:#171512; --ink-soft:#5B564C; --line:#DFD9CB;
    --gold:#B4862C; --teal:#2E6659; --teal-soft:#DCEBE6;
    --serif:'Fraunces',Georgia,serif; --sans:'Inter',-apple-system,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15130F; --paper:#1E1B15; --ink:#F3EFE4; --ink-soft:#B7AF9C; --line:#3A3529;
      --gold:#D9AD54; --teal:#5CA793; --teal-soft:#1B322B;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15130F; --paper:#1E1B15; --ink:#F3EFE4; --ink-soft:#B7AF9C; --line:#3A3529;
    --gold:#D9AD54; --teal:#5CA793; --teal-soft:#1B322B;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); padding:28px 20px 60px;}
  .top{max-width:1200px; margin:0 auto 22px; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px;}
  .brand{font-family:var(--serif); font-weight:700; font-size:1.3rem;}
  .brand span{color:var(--gold);}
  .top p{font-size:0.85rem; color:var(--ink-soft); margin:4px 0 0; max-width:480px;}

  .board{
    max-width:1200px; margin:0 auto; display:grid;
    grid-template-columns:repeat(6, minmax(180px,1fr)); gap:12px; overflow-x:auto;
  }
  .col{background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:12px; min-height:120px;}
  .col h3{font-size:0.76rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); margin:0 0 12px; font-weight:600;}
  .col .count{font-weight:700; color:var(--ink);}

  .card{
    background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:10px 11px;
    margin-bottom:10px; font-size:0.82rem; transition:box-shadow 0.15s;
  }
  .card .folio{font-weight:700; color:var(--gold); font-size:0.78rem;}
  .card .item{margin:3px 0 6px; line-height:1.3;}
  .card .amount{font-size:0.76rem; color:var(--ink-soft); margin-bottom:8px;}
  .card button{
    width:100%; background:none; border:1px solid var(--teal); color:var(--teal); font-size:0.72rem;
    font-weight:600; padding:6px; border-radius:4px; cursor:pointer; font-family:var(--sans);
  }
  .card button:hover{background:var(--teal); color:#fff;}
  .card button:disabled{opacity:0.35; cursor:default; border-color:var(--line); color:var(--ink-soft);}
  .card button:disabled:hover{background:none; color:var(--ink-soft);}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--teal); color:#fff; padding:12px 20px; border-radius:6px; font-size:0.85rem;
    box-shadow:0 8px 20px rgba(0,0,0,0.18); opacity:0; transition:all 0.25s; pointer-events:none;
    display:flex; align-items:center; gap:8px; max-width:90vw;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  footer{text-align:center; font-size:0.75rem; color:var(--ink-soft); margin-top:40px;}

  @media (max-width:900px){
    .board{grid-template-columns:1fr; }
  }
</style>
</head>
<body>
  <div class="top">
    <div>
      <div class="brand">REMATE<span>ZS</span> · Panel interno</div>
      <p>El equipo mueve cada adjudicación de etapa. Al avanzar una tarjeta, el cliente recibe la notificación automática en el portal y el bot de WhatsApp — sin que nadie tenga que escribirle.</p>
    </div>
  </div>

  <div class="board" id="board"></div>
  <div class="toast" id="toast"></div>
  <footer>Prototipo — Rematezs · Examen Transversal Crea e Innova</footer>

<script>
const STAGES = [
  "Pago recibido",
  "Pago validado",
  "Generando acta",
  "En facturación",
  "Listo para retiro",
  "Retirado",
];

let cards = [
  {folio:"R-1042", item:"Lote 118 — Camioneta utilitaria", amount:"$4.850.000", stage:0},
  {folio:"R-1058", item:"Lote 22 — Set de herramientas", amount:"$210.000", stage:1},
  {folio:"R-1077", item:"Lote 46 — Torno industrial", amount:"$1.230.000", stage:2},
  {folio:"R-1061", item:"Lote 9 — Estanterías metálicas", amount:"$95.000", stage:3},
  {folio:"R-1103", item:"Lote 7 — Mobiliario de oficina", amount:"$390.000", stage:4},
  {folio:"R-1030", item:"Lote 3 — Generador eléctrico", amount:"$680.000", stage:5},
];

const board = document.getElementById("board");
const toast = document.getElementById("toast");

function showToast(msg){
  toast.textContent = "📲 " + msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2600);
}

function renderBoard(){
  board.innerHTML = "";
  STAGES.forEach((stageName, i) => {
    const col = document.createElement("div");
    col.className = "col";
    const inStage = cards.filter(c => c.stage === i);
    col.innerHTML = `<h3>${stageName} <span class="count">(${inStage.length})</span></h3>`;
    inStage.forEach(c => {
      const card = document.createElement("div");
      card.className = "card";
      const isLast = i === STAGES.length - 1;
      card.innerHTML = `
        <div class="folio">${c.folio}</div>
        <div class="item">${c.item}</div>
        <div class="amount">${c.amount}</div>
        <button ${isLast ? "disabled" : ""}>${isLast ? "Proceso finalizado" : "Avanzar a “" + STAGES[i+1] + "” →"}</button>
      `;
      if(!isLast){
        card.querySelector("button").addEventListener("click", () => {
          c.stage += 1;
          renderBoard();
          showToast(`${c.folio}: notificación automática enviada al cliente — nuevo estado "${STAGES[c.stage]}"`);
        });
      }
      col.appendChild(card);
    });
    board.appendChild(col);
  });
}

renderBoard();
</script>
</body>
</html>
